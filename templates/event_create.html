{% extends "wiki_base.html" %}

{% block title %}Create Event — EventPass{% endblock %}

{% block content %}
<div style="max-width: 680px; margin: 20px auto;">
    <h1 class="page-title">Create Campus Event</h1>
    <p class="page-subtitle">Configure event parameters, establish seat capacities, and specify audience department eligibility.</p>

    <div class="card-box" style="padding: 28px;">
        <form method="POST" action="{{ url_for('event_create') }}">
            <div class="form-group">
                <label class="form-label">Event Title <span style="color: #b91c1c;">*</span></label>
                <input type="text" name="title" class="input-clean" placeholder="e.g. CS Department Freshers' Welcome 2026" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label">Description & Agenda <span style="color: #b91c1c;">*</span></label>
                <textarea name="description" class="textarea-clean" rows="4" placeholder="Overview of the event, agenda tracks, and participant instructions..." required></textarea>
            </div>

            <div style="display: flex; gap: 16px; flex-wrap: wrap;">
                <div class="form-group" style="flex: 1; min-width: 220px;">
                    <label class="form-label">Department Eligibility <span style="color: #b91c1c;">*</span></label>
                    <select name="department_restriction" class="select-clean" required>
                        <option value="All Departments">All Departments (Open Access)</option>
                        <option value="Computer Science" selected>Computer Science Only</option>
                        <option value="Mechanical Engineering">Mechanical Engineering Only</option>
                        <option value="Management Studies">Management Studies Only</option>
                        <option value="Physics">Physics Only</option>
                    </select>
                </div>

                <div class="form-group" style="width: 160px;">
                    <label class="form-label">Seat Capacity <span style="color: #b91c1c;">*</span></label>
                    <input type="number" name="capacity" class="input-clean" value="50" min="1" max="5000" required>
                </div>
            </div>

            <div style="display: flex; gap: 16px; flex-wrap: wrap;">
                <div class="form-group" style="flex: 1; min-width: 180px;">
                    <label class="form-label">Date <span style="color: #b91c1c;">*</span></label>
                    <input type="date" name="event_date" class="input-clean" required value="2026-11-20">
                </div>

                <div class="form-group" style="flex: 1; min-width: 180px;">
                    <label class="form-label">Time <span style="color: #b91c1c;">*</span></label>
                    <input type="text" name="event_time" class="input-clean" value="10:00 AM" placeholder="e.g. 10:00 AM - 01:00 PM" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Venue Location <span style="color: #b91c1c;">*</span></label>
                <input type="text" name="venue" class="input-clean" value="CCC Complex (Central Computing Center)" required>
            </div>

            <div style="margin-top: 28px; display: flex; gap: 10px; align-items: center;">
                <button type="submit" class="btn-clean btn-primary-clean" style="padding: 9px 20px;">
                    Publish Event &rarr;
                </button>
                <a href="{{ url_for('organizer_dashboard') }}" class="btn-clean">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
