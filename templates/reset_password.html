{% extends "wiki_base.html" %}

{% block title %}Set New Password — EventQR{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 32px auto;">

    <div style="text-align: center; margin-bottom: 24px;">
        <div style="width: 52px; height: 52px; border-radius: 50%; background: #eff6ff; color: #2563eb; display: flex; align-items: center; justify-content: center; font-size: 20px; margin: 0 auto 12px auto; border: 1px solid #bfdbfe;">
            <i class="fa-solid fa-lock"></i>
        </div>
        <h1 class="page-title" style="margin-bottom: 6px; font-size: 22px;">Set New Password</h1>
        <p class="page-subtitle" style="margin-bottom: 0;">
            Code sent to <strong style="color: var(--text-heading);">{{ email }}</strong>
        </p>
    </div>

    <div class="card-box" style="padding: 28px;">

        <div style="background: #f8fafc; border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 20px; text-align: center; font-size: 13px; color: var(--text-muted);">
            <i class="fa-regular fa-envelope" style="margin-right: 5px; color: #2563eb;"></i> Enter the 6-digit password reset code sent to your email to configure a new password.
        </div>

        <form method="POST" action="{{ url_for('reset_password_route') }}">
            <input type="hidden" name="email" value="{{ email }}">

            <div class="form-group-clean">
                <label class="label-clean">6-Digit Verification Code</label>
                <input type="text" name="otp_code" id="otpInput" class="input-clean" placeholder="••••••" maxlength="6" required autofocus
                       style="font-family: monospace; font-size: 20px; letter-spacing: 6px; text-align: center; font-weight: 700;">
            </div>

            <div class="form-group-clean">
                <label class="label-clean">New Password</label>
                <input type="password" name="new_password" class="input-clean" placeholder="Minimum 6 characters" required minlength="6">
            </div>

            <div class="form-group-clean">
                <label class="label-clean">Confirm New Password</label>
                <input type="password" name="confirm_password" class="input-clean" placeholder="Re-enter new password" required minlength="6">
            </div>

            <div style="margin-top: 24px;">
                <button type="submit" class="btn-clean btn-clean-primary" style="width: 100%; justify-content: center; padding: 10px;">
                    Update Password & Log In &rarr;
                </button>
            </div>
        </form>

        <div style="margin-top: 20px; text-align: center; font-size: 13px; color: var(--text-muted);">
            <a href="{{ url_for('login') }}">Back to log in</a>
        </div>
    </div>

</div>
{% endblock %}
