{% extends "wiki_base.html" %}

{% block title %}Reset Password — EventQR{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 36px auto;">

    <div style="text-align: center; margin-bottom: 24px;">
        <div style="width: 52px; height: 52px; border-radius: 50%; background: #eff6ff; color: #2563eb; display: flex; align-items: center; justify-content: center; font-size: 20px; margin: 0 auto 12px auto; border: 1px solid #bfdbfe;">
            <i class="fa-solid fa-key"></i>
        </div>
        <h1 class="page-title" style="margin-bottom: 6px; font-size: 22px;">Forgot Password</h1>
        <p class="page-subtitle" style="margin-bottom: 0;">Enter your registered campus email to receive a 6-digit recovery code.</p>
    </div>

    <div class="card-box" style="padding: 28px;">
        <form method="POST" action="{{ url_for('forgot_password') }}">
            <div class="form-group-clean">
                <label class="label-clean">Campus Email Address</label>
                <input type="email" name="email" class="input-clean" placeholder="e.g. rohan.sen@campus.edu" required autofocus>
            </div>

            <div style="margin-top: 20px;">
                <button type="submit" class="btn-clean btn-clean-primary" style="width: 100%; justify-content: center; padding: 10px;">
                    Send Password Reset Code &rarr;
                </button>
            </div>
        </form>

        <div style="margin-top: 20px; text-align: center; font-size: 13px; color: var(--text-muted);">
            Remembered your credentials? <a href="{{ url_for('login') }}" style="font-weight: 600;">Back to log in</a>
        </div>
    </div>

</div>
{% endblock %}
