{% extends "wiki_base.html" %}

{% block title %}Sign In — EventPass{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 40px auto;">
    <div class="card-box" style="padding: 32px;">
        <h1 style="font-size: 22px; font-weight: 700; color: var(--text-heading); margin: 0 0 6px 0; text-align: center;">Sign In to EventPass</h1>
        <p style="font-size: 13.5px; color: var(--text-muted); text-align: center; margin: 0 0 24px 0;">Access your event admission passes and account details.</p>

        <!-- Method Switcher Pills -->
        <div style="display: flex; background: #f1f5f9; padding: 3px; border-radius: var(--radius-sm); margin-bottom: 22px;">
            <a href="{{ url_for('login') }}" style="flex: 1; text-align: center; padding: 6px; font-size: 13px; font-weight: 600; border-radius: 4px; background: #ffffff; color: var(--text-heading); box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
                Password
            </a>
            <a href="{{ url_for('login_otp_request') }}" style="flex: 1; text-align: center; padding: 6px; font-size: 13px; font-weight: 500; border-radius: 4px; color: var(--text-muted);">
                Email OTP
            </a>
        </div>

        <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}">
            <div class="form-group">
                <label class="form-label">Email or University Roll Number</label>
                <input type="text" name="login_id" id="loginId" class="input-clean" placeholder="student@campus.edu or 25CS101" required autofocus>
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px;">
                    <label class="form-label" style="margin: 0;">Password</label>
                    <a href="{{ url_for('forgot_password') }}" style="font-size: 12.5px;">Forgot?</a>
                </div>
                <input type="password" name="password" id="loginPw" class="input-clean" placeholder="••••••••" required>
            </div>

            <div style="margin-top: 22px;">
                <button type="submit" class="btn-clean btn-primary-clean" style="width: 100%; padding: 10px; font-size: 14.5px;">
                    Sign In
                </button>
            </div>
        </form>

        <div style="margin-top: 22px; text-align: center; font-size: 13px; color: var(--text-muted);">
            Don't have an account? <a href="{{ url_for('register_user') }}" style="font-weight: 600;">Sign up here</a>.
        </div>
    </div>
</div>
{% endblock %}
